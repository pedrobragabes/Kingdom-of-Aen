name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run validate
      - name: Domain tests and coverage
        run: |
          mkdir -p coverage
          node --test --experimental-test-coverage --test-reporter=lcov tests/*.test.js > coverage/lcov.info
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: validation-evidence
          path: |
            coverage/
            test-results/
          retention-days: 7
